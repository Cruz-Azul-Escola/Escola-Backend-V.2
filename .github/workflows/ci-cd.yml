name: Pipeline CI/CD - Escola Backend V2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =========================================================================
  # JOB 1: Continuous Integration (CI)
  # Executa em todo push e pull_request para a branch main
  # =========================================================================
  ci:
    name: CI - Build, Testes e Validação (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Realizar o checkout do projeto
        uses: actions/checkout@v4

      - name: 2. Configurar o ambiente Java (JDK 11) e Cache do Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: 3. Instalar dependências do projeto
        run: mvn dependency:go-offline -B

      - name: 4. Executar testes unitários (JUnit 5) e empacotar aplicação (.war)
        run: mvn clean test package -B

      - name: 5. Salvar pacote WAR gerado como artefato da CI
        uses: actions/upload-artifact@v4
        with:
          name: escola-backend-v2-war
          path: target/*.war
          retention-days: 7

  # =========================================================================
  # JOB 2: Continuous Deployment (CD)
  # Executa SOMENTE após um push na branch main E se a CI concluir com sucesso
  # =========================================================================
  cd:
    name: CD - Deploy Automatizado (Render / Container)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 1. Realizar o checkout do projeto para validação de Deploy
        uses: actions/checkout@v4

      - name: 2. Validar imagem Docker de Produção (Tomcat 10.1 + WAR)
        run: docker build -t escola-backend-v2:${{ github.sha }} .

      - name: 3. Acionar Deployment Automatizado no Render via Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::A secret RENDER_DEPLOY_HOOK_URL não foi configurada no repositório GitHub (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "Disparando deployment da nova versão no Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Status HTTP retornado pelo Render: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deployment acionado com sucesso no ambiente de produção!"
          else
            echo "::error::Falha ao acionar o Deploy Hook. Código HTTP: $HTTP_STATUS"
            exit 1
          fi
